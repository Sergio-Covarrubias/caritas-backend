worker_processes 1;

events {
    worker_connections 1024;
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    upstream core_service {
        server core:8080;
    }

    upstream service_reservations_service {
        server service-reservations:8080;
    }

    server {
        listen 443 ssl;
        server_name int.api.caritas.automvid.store;

        ssl_certificate     /etc/letsencrypt/live/int.api.caritas.automvid.store/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/int.api.caritas.automvid.store/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Route /api/internal/* to service-reservations
        location /api/internal/ {
            proxy_pass http://service_reservations_service/api/internal/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Route /api/* to core service
        location /api/ {
            proxy_pass http://core_service/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Default fallback
        location / {
            return 404;
        }
    }
}
