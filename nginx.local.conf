worker_processes 1;

events { 
    worker_connections 1024; 
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    upstream core_service {
        server core:8080;
    }

    upstream service_reservations_service {
        server service-reservations:8080;
    }

    server {
        listen 8080;

        # Route /api/internal/* to service-reservations
        location /api/internal/ {
            proxy_pass http://service_reservations_service/api/internal/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Route /api/* to core service
        location /api/ {
            proxy_pass http://core_service/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Default fallback
        location / {
            return 404;
        }
    }
}
