# ~~~ Staging docker-compose.yml ~~~ #

services:
  database:
    image: postgres:16
    container_name: database
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: caritas_db
    ports:
      - "5432:5432"
      - "5433:5432" # For using a local client to connect to the DB 
    volumes:
      - DB_Volume:/var/lib/postgresql/data
    networks:
      - backend

  core:
    build:
      context: .
      dockerfile: ./dockerfiles/Dockerfile-staging
    container_name: core
    environment:
      DB_URL: jdbc:postgresql://database:5432/caritas_db
      BASE_PATH: /api
      SELF_API_URL: ${SELF_API_URL}
      STAGE: prod
      
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      - database
    ports:
      - "8081:8080"
    networks:
      - backend

    service-reservations:
      build:
        context: .
        dockerfile: ./dockerfiles/Dockerfile-staging
      container_name: service-reservations
      environment:
        DB_URL: jdbc:postgresql://database:5432/caritas_db
        BASE_PATH: /api
        SELF_API_URL: ${SELF_API_URL}
        STAGE: prod

        DB_USER: ${DB_USER}
        DB_PASSWORD: ${DB_PASSWORD}
      depends_on:
        - database
      ports:
        - "8082:8080"
      networks:
        - backend

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.local.conf:/etc/nginx/nginx.conf:ro
    restart: always
    networks:
      - backend

volumes:
  DB_Volume:

networks:
  backend:
    driver: bridge
